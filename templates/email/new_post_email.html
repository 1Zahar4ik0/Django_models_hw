<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ post.title }}</title>
</head>
<body>
    <p>
        Здравствуй, {{ user.username }}.
        Новая статья в твоём любимом разделе!
    </p>
    <h2>{{ post.title }}</h2>
    <p>{{ post.text|slice:":50" }}</p>
    <p>
        <a href="{{ post_url }}">Прочитать статью полностью</a>
    </p>
    <p>
        Категории:
        {% for category in post.categories.all %}
            {{ category.name }}{% if not forloop.last %}, {% endif %}
        {% endfor %}
    </p>
</body>
</html>
